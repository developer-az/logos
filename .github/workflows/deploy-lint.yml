# Renders every kustomization and validates it against the Kubernetes and CRD schemas (Strimzi,
# Gateway API, Envoy Gateway, cert-manager, External Secrets), lints the shell scripts and the
# workflows themselves.
name: deploy-lint

on:
  pull_request:
    paths: [deploy/**, scripts/**, .github/**]
  push:
    branches: [main]
    paths: [deploy/**, scripts/**, .github/**]

permissions:
  contents: read

env:
  KUSTOMIZE_VERSION: 5.8.2
  KUBECONFORM_VERSION: 0.8.0
  ACTIONLINT_VERSION: 1.7.12

jobs:
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install kustomize and kubeconform
        run: |
          mkdir -p "$HOME/bin" && echo "$HOME/bin" >> "$GITHUB_PATH"
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$HOME/bin"
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C "$HOME/bin" kubeconform
      - name: Render and validate
        run: |
          for dir in deploy/k8s/overlays/local deploy/k8s/overlays/aks deploy/k8s/platform/aks; do
            echo "::group::$dir"
            kustomize build "$dir" | kubeconform -strict -summary -kubernetes-version 1.33.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -
            echo "::endgroup::"
          done

  scripts-and-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck scripts/*.sh deploy/vm/*.sh
      - name: VM compose file
        run: |
          printf 'POSTGRES_PASSWORD=lint-only\nSITE_ADDRESS=example.com\n' > deploy/vm/.env
          docker compose -f deploy/vm/compose.yaml config --quiet
      - name: VM load generator matches the Kubernetes one
        run: |
          awk '/run.sh: \|/{f=1;next} /^---/{f=0} f' deploy/k8s/apps/load-generator.yaml | sed 's/^    //' \
            | diff - <(sed 2d deploy/vm/load-generator.sh)
      - name: actionlint
        run: |
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar -xz actionlint
          ./actionlint -color
