# Database passwords come from Azure Key Vault through the External Secrets Operator, which signs
# in with workload identity (no stored Azure credentials). Kafka passwords need no sync: Strimzi
# generates them in this namespace. Create the three Key Vault secrets once (deploy/README.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: key-vault-reader
  annotations:
    azure.workload.identity/client-id: KEY_VAULT_CLIENT_ID
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-key-vault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: KEY_VAULT_URL
      serviceAccountRef: { name: key-vault-reader }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: azure-key-vault }
  target: { name: postgres-credentials, creationPolicy: Owner }
  data:
    - { secretKey: postgres-password, remoteRef: { key: logos-postgres-password } }
    - { secretKey: orders-password, remoteRef: { key: logos-orders-db-password } }
    - { secretKey: inventory-password, remoteRef: { key: logos-inventory-db-password } }
