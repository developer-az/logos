# kind on a laptop or a CI runner: one Kafka broker, one replica of everything, locally built
# images. scripts/kind-up.sh builds the images, loads them into kind and applies this overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: logos
resources:
  - ../../namespace
  - ../../kafka
  - ../../apps
images:
  - { name: ghcr.io/developer-az/logos-order-service, newTag: dev }
  - { name: ghcr.io/developer-az/logos-inventory-service, newTag: dev }
  - { name: ghcr.io/developer-az/logos-dashboard, newTag: dev }
replicas:
  - { name: order-service, count: 1 }
  - { name: inventory-service, count: 1 }
  - { name: dashboard, count: 1 }
patches:
  # A single broker: replication factors and min ISR of 1, smaller disk.
  - target: { kind: KafkaNodePool, name: dual-role }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
      - { op: replace, path: /spec/storage/volumes/0/size, value: 2Gi }
  - target: { kind: Kafka, name: logos-kafka }
    patch: |
      - op: replace
        path: /spec/kafka/config
        value:
          offsets.topic.replication.factor: 1
          transaction.state.log.replication.factor: 1
          transaction.state.log.min.isr: 1
          default.replication.factor: 1
          min.insync.replicas: 1
          auto.create.topics.enable: false
  - target: { kind: KafkaTopic }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: StatefulSet, name: postgres }
    patch: |
      - { op: replace, path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage, value: 1Gi }
  - target: { kind: Deployment, name: load-generator }
    patch: |
      - { op: replace, path: /spec/template/spec/containers/0/env/0/value, value: "2" }
