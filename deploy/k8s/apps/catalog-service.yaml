# Catalog service: shelf prices the order service charges from (services/src/Catalog.Service).
# No Kafka: this is reference data read over HTTP. Database: its own "catalog" database and role.
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  labels: { app.kubernetes.io/name: catalog-service }
spec:
  selector: { app.kubernetes.io/name: catalog-service }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  labels: { app.kubernetes.io/name: catalog-service, app.kubernetes.io/component: api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: catalog-service }
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: catalog-service, app.kubernetes.io/component: api }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654 # "app" in the mcr.microsoft.com/dotnet/aspnet image
        runAsGroup: 1654
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: catalog-service } }
      containers:
        - name: catalog-service
          image: ghcr.io/developer-az/logos-catalog-service
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: CATALOG_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: catalog-password } }
            - name: ConnectionStrings__Catalog
              value: Host=postgres;Database=catalog;Username=catalog;Password=$(CATALOG_DB_PASSWORD)
            - { name: Catalog__SeedDemoData, value: "true" }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalog-service
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: catalog-service }
