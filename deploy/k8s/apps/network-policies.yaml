# Ingress is denied by default in the namespace; each policy below opens one path. Strimzi creates
# the policies for the Kafka pods itself, limited to the apps by the listener's networkPolicyPeers
# (deploy/k8s/kafka/kafka-cluster.yaml). Port-forwarding goes through the kubelet and is unaffected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-services
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [order-service, inventory-service, procurement-service, finance-service, catalog-service] }
      ports:
        - { port: 5432, protocol: TCP }
---
# The dashboard is the public face of the demo.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard-from-anywhere
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: dashboard }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 8080, protocol: TCP }
---
# The catalogue is reference data read by the order service (at checkout) and by the dashboard
# (to display the price that will be charged).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-from-order-and-dashboard
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: catalog-service }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: order-service }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: dashboard }
      ports:
        - { port: 8080, protocol: TCP }
---
# The dashboard proxies the page's writes (checkout, purchase orders) to the owning services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: write-apis-from-dashboard
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [order-service, procurement-service] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: dashboard }
      ports:
        - { port: 8080, protocol: TCP }
---
# The write APIs take traffic from the load generator and from the gateway's proxies (the AKS
# overlay publishes the order API, rate limited, through Envoy Gateway).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apis-from-load-generator-and-gateway
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [order-service, inventory-service, procurement-service] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: load-generator }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system }
      ports:
        - { port: 8080, protocol: TCP }
