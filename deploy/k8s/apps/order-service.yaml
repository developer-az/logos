# Order service: HTTP API + saga handler (services/src/Order.Service).
# Kafka: Strimzi TLS listener with SCRAM-SHA-512 as KafkaUser "order-service"; Strimzi owns the
# topics, so the service does not provision them. Database: its own "orders" database and role.
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels: { app.kubernetes.io/name: order-service }
spec:
  selector: { app.kubernetes.io/name: order-service }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels: { app.kubernetes.io/name: order-service, app.kubernetes.io/component: api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: order-service }
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: order-service, app.kubernetes.io/component: api }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654 # "app" in the mcr.microsoft.com/dotnet/aspnet image
        runAsGroup: 1654
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: order-service } }
      containers:
        - name: order-service
          image: ghcr.io/developer-az/logos-order-service
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: ORDERS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: orders-password } }
            - name: ConnectionStrings__Orders
              value: Host=postgres;Database=orders;Username=orders;Password=$(ORDERS_DB_PASSWORD)
            - { name: Kafka__BootstrapServers, value: logos-kafka-kafka-bootstrap:9093 }
            - { name: Kafka__SecurityProtocol, value: SaslSsl }
            - { name: Kafka__SaslMechanism, value: ScramSha512 }
            - { name: Kafka__SaslUsername, value: order-service }
            - name: Kafka__SaslPassword
              valueFrom: { secretKeyRef: { name: order-service, key: password } }
            - { name: Kafka__SslCaLocation, value: /etc/kafka-ca/ca.crt }
            - { name: Kafka__ProvisionTopics, value: "false" }
            - name: Kafka__ClientId
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: kafka-ca, mountPath: /etc/kafka-ca, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: kafka-ca
          secret:
            secretName: logos-kafka-cluster-ca-cert
            items: [{ key: ca.crt, path: ca.crt }]
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-service
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: order-service }
