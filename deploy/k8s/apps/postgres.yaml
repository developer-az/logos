# Single PostgreSQL instance holding one database per service, each owned by its own role, so a
# service can only reach its own data. Fine for the demo; production would use Azure Database for
# PostgreSQL (or the CloudNativePG operator) with backups and failover.
#
# Expects Secret "postgres-credentials" with keys postgres-password, orders-password and
# inventory-password. scripts/kind-up.sh generates it locally; on AKS it comes from Key Vault
# (overlays/aks/external-secrets.yaml). Use URL-safe values (the scripts use hex) because the
# service connection strings embed them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  10-service-databases.sh: |
    #!/bin/sh
    # Runs once, on first start with an empty data directory.
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
      -v orders_pw="$ORDERS_DB_PASSWORD" -v inventory_pw="$INVENTORY_DB_PASSWORD" <<'SQL'
    CREATE ROLE orders LOGIN PASSWORD :'orders_pw';
    CREATE DATABASE orders OWNER orders;
    REVOKE CONNECT ON DATABASE orders FROM PUBLIC;
    CREATE ROLE inventory LOGIN PASSWORD :'inventory_pw';
    CREATE DATABASE inventory OWNER inventory;
    REVOKE CONNECT ON DATABASE inventory FROM PUBLIC;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres }
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/component: database }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/component: database }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # "postgres" in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: postgres }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: postgres-password } }
            - name: ORDERS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: orders-password } }
            - name: INVENTORY_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: inventory-password } }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"] }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - name: init
          configMap: { name: postgres-init, defaultMode: 0555 }
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
