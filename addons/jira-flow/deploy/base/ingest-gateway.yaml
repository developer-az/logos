apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-gateway
  labels: { app.kubernetes.io/name: ingest-gateway, app.kubernetes.io/part-of: delivery }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: ingest-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ingest-gateway, app.kubernetes.io/part-of: delivery }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      volumes:
        - name: kafka-ca
          secret: { secretName: logos-kafka-cluster-ca-cert, optional: true }
      containers:
        - name: ingest-gateway
          image: ingest-gateway
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: delivery-config }
          env:
            - name: JIRA_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: jira-webhook, key: secret } }
            - name: KAFKA_SASL_USERNAME
              value: ingest-gateway
            - name: KAFKA_SASL_PASSWORD
              valueFrom: { secretKeyRef: { name: ingest-gateway, key: password, optional: true } }
          volumeMounts:
            - { name: kafka-ca, mountPath: /etc/kafka-ca, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-gateway
spec:
  selector: { app.kubernetes.io/name: ingest-gateway }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ingest-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ingest-gateway }
