apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-service
  labels: { app.kubernetes.io/name: metrics-service, app.kubernetes.io/part-of: delivery }
spec:
  # One replica while timelines are held in memory: with several, each pod would own a subset
  # of partitions and HTTP reads would see only that subset. Scale out once timelines are
  # stored durably.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: metrics-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: metrics-service, app.kubernetes.io/part-of: delivery }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 30
      volumes:
        - name: kafka-ca
          secret: { secretName: logos-kafka-cluster-ca-cert, optional: true }
        - name: tmp # .NET needs a writable /tmp with a read-only root filesystem
          emptyDir: {}
      containers:
        - name: metrics-service
          image: metrics-service
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: delivery-config }
          env:
            - name: Kafka__SaslUsername
              value: metrics-service
            - name: Kafka__SaslPassword
              valueFrom: { secretKeyRef: { name: metrics-service, key: password, optional: true } }
          volumeMounts:
            - { name: kafka-ca, mountPath: /etc/kafka-ca, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /healthz/ready, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /healthz/ready, port: http }
          livenessProbe:
            httpGet: { path: /healthz/live, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-service
spec:
  selector: { app.kubernetes.io/name: metrics-service }
  ports: [{ name: http, port: 80, targetPort: http }]
