apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Runs next to the platform in namespace "logos" (created by deploy/k8s), so it can read the
# Strimzi cluster CA and its KafkaUser secrets without copying them across namespaces.
namespace: logos
resources:
  - configmap.yaml
  - ingest-gateway.yaml
  - metrics-service.yaml
images:
  - name: ingest-gateway
    newName: ghcr.io/OWNER/ingest-gateway
    newTag: latest
  - name: metrics-service
    newName: ghcr.io/OWNER/metrics-service
    newTag: latest
