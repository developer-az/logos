# Local dev stack: single-node Kafka in KRaft mode (no ZooKeeper) plus both services.
#   cp .env.example .env   # then set JIRA_WEBHOOK_SECRET, e.g. openssl rand -hex 32
#   docker compose up --build
#   ./scripts/smoke.sh
services:
  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list"]
      interval: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on: { kafka: { condition: service_healthy } }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        create() { /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 6 --replication-factor 1 "$$@"; }
        # The issue-event log is the source of truth (metrics are rebuilt from it), so keep it forever.
        create --topic jira.issue-events.v1 --config retention.ms=-1
        create --topic jira.issue-events.dlq.v1
        # Latest metrics per issue only: compaction keeps one record per key.
        create --topic delivery.issue-metrics.v1 --config cleanup.policy=compact

  ingest-gateway:
    build: ./services/ingest-gateway
    depends_on: { kafka-init: { condition: service_completed_successfully } }
    ports: ["8080:8080"]
    environment:
      KAFKA_BROKERS: kafka:19092
      # From .env (gitignored); see .env.example. Never commit a real value.
      JIRA_WEBHOOK_SECRET: ${JIRA_WEBHOOK_SECRET:?set JIRA_WEBHOOK_SECRET in .env}

  metrics-service:
    build: ./services/metrics-service
    depends_on: { kafka-init: { condition: service_completed_successfully } }
    ports: ["8081:8080"]
    environment:
      Kafka__BootstrapServers: kafka:19092
